name: Terraform deploy
run-name: Terraform ${{ inputs.action }} (dev) by @${{ github.actor }}

# Manual deployment, or destruction, of the dev environment.
# Runs only from main, in the protected GitHub environment "dev":
# GitHub waits for a reviewer's approval before the job starts.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply: create or update the dev environment; destroy: delete every application resource (the bootstrap is not affected)"
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read

# Never run two deployments of the same environment at the same time,
# and never cancel a deployment in progress.
concurrency:
  group: terraform-deploy-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: eu-west-3

jobs:
  deploy:
    name: ${{ inputs.action == 'destroy' && 'Destroy (dev)' || 'Deploy (dev)' }}
    runs-on: ubuntu-latest
    # Explicit guard; the environment's branch rule enforces it as well.
    if: github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      contents: read
      id-token: write   # request the OIDC token exchanged for AWS credentials
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: terraform-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform plan (${{ inputs.action }})
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -no-color -lock-timeout=120s -out=tfplan
          else
            terraform plan -no-color -lock-timeout=120s -out=tfplan
          fi
          {
            echo "### Terraform ${ACTION} plan applied to \`dev\`"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo '```terraform'
            terraform show -no-color tfplan | sed "s/${TF_VAR_account_id}/<account-id>/g"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the plan above: a deployment, or a destruction.
      - name: Terraform apply
        run: terraform apply -no-color -lock-timeout=120s tfplan
