name: Tests

# Unit tests of every Lambda service (one folder per service under services/),
# on every pull request to main. No AWS access: AWS services are mocked.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Single job name, required by the branch ruleset.
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same version as the Lambda runtime
          cache: pip
          cache-dependency-path: services/*/requirements-dev.txt

      - name: Run the unit tests of every service
        run: |
          status=0
          for service in services/*/; do
            echo "::group::Unit tests: ${service}"
            pip install -q -r "${service}requirements-dev.txt"
            (cd "${service}" && python -m pytest -v) || status=1
            echo "::endgroup::"
          done
          exit "$status"
